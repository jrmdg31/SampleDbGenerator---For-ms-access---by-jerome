name: 🐛 Bug report
description: Something broke? Tell me so I can fix it.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this! The more detail you give, the faster I can fix it. ☕
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you click, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: error-message
    attributes:
      label: Exact error message
      description: Paste the error text or drop in a screenshot.
  - type: dropdown
    id: format
    attributes:
      label: Format you picked
      options:
        - .mdb (Access 2000-2003)
        - .accdb (Access 2007+)
        - CSV only
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 7 32-bit, Windows 10, Windows 11
  - type: input
    id: access
    attributes:
      label: Microsoft Access version
      placeholder: e.g. Access 2003, Access 2016, none installed
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: e.g. Chrome 120, Firefox, Edge
  - type: checkboxes
    id: tried-unblock
    attributes:
      label: Did you try the "Blocked? Fix it" guide?
      options:
        - label: Yes, I tried it (or it doesn't apply to my error)
